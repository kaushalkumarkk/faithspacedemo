# Optional: local PostgreSQL instead of Supabase.  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: faithspace
      POSTGRES_PASSWORD: faithspace
      POSTGRES_DB: faithspace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
